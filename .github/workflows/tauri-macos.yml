name: Build macOS DMG (Tauri)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build (Tauri)
        run: npm run tauri:build

      - name: Ad-hoc code sign (allows "Open Anyway" on macOS)
        run: |
          APP_PATH="src-tauri/target/release/bundle/macos/Dither Yuki.app"
          codesign --deep --force --sign - "$APP_PATH"

      - name: Verify build outputs
        run: |
          ls -R src-tauri/target/release/bundle/macos/

      - name: Collect DMG
        run: |
          mkdir -p dist-macos
          # Re-create DMG after ad-hoc signing
          hdiutil create -volname "Dither Yuki" \
            -srcfolder "src-tauri/target/release/bundle/macos/Dither Yuki.app" \
            -ov -format UDZO "Dither Yuki.dmg"
          cp "Dither Yuki.dmg" dist-macos/

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dither-yuki-macos-dmg
          path: |
            Dither Yuki.dmg
            dist-macos/**
          if-no-files-found: error
