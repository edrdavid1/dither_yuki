name: Build macOS DMG (Tauri)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build (Tauri)
        run: npm run tauri:build

      - name: Ad-hoc code sign (allows "Open Anyway" on macOS)
        run: |
          APP_PATH="src-tauri/target/release/bundle/macos/Dither Yuki.app"
          codesign --deep --force --sign - "$APP_PATH"

      - name: Collect DMG
        run: |
          hdiutil create -volname "Dither Yuki" \
            -srcfolder "src-tauri/target/release/bundle/macos/Dither Yuki.app" \
            -ov -format UDZO "Dither Yuki.dmg"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dither-yuki-macos-dmg
          path: Dither Yuki.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Dither Yuki.dmg
          generate_release_notes: true
